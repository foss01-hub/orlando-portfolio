allowBuilds:
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# Versiones corregidas de dependencias internas de eslint y postcss (solo
# desarrollo y build), con avisos de seguridad de 2026-10.
overrides:
  "brace-expansion@<2": ^1.1.21
  "brace-expansion@>=4 <6": ^5.0.12
  js-yaml: ^4.3.2
  "nanoid@<4": ^3.3.18
  source-map-js: ^1.2.2
  zod: ^4.6.6
